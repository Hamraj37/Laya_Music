name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.8.2)"
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out Version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="1.8.1-${GITHUB_SHA:0:7}"
            fi
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Setup Secrets (Keystore & local.properties)
        run: |

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            {
              echo "storeFile=bitchord-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Prod Release APK
        run: ./gradlew assembleProdRelease

      - name: Prepare Release Artifacts
        run: |
          v="${{ steps.version.outputs.value }}"
          mkdir -p dist
          for f in app/build/outputs/apk/prod/release/*.apk; do
            if [ -f "$f" ]; then
              cp "$f" "dist/Laya-v$v.apk"
            fi
          done
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laya-release-apk
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Laya v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
