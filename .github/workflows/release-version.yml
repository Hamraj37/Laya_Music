name: Release Version APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Version APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Version Name from build.gradle.kts
        id: get_version
        run: |
          VERSION=$(sed -n 's/.*extra\["layaVersionName"\] = "\(.*\)".*/\1/p' build.gradle.kts)
          SUFFIX=$(sed -n 's/.*extra\["layaBetaSuffix"\] = "\(.*\)".*/\1/p' build.gradle.kts)
          if [ -z "$VERSION" ]; then
            VERSION="1.8.1"
          fi
          if [ -n "$SUFFIX" ]; then
            FULL_VERSION="${VERSION}-${SUFFIX}"
          else
            FULL_VERSION="${VERSION}"
          fi
          TAG_NAME="v${FULL_VERSION}"
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Extracted Version: $FULL_VERSION, Tag: $TAG_NAME"

      - name: Setup Secrets (Keystore & local.properties)
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            {
              echo "storeFile=bitchord-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Prod Release APK
        run: ./gradlew assembleProdRelease

      - name: Prepare Release Artifacts
        run: |
          tag="${{ steps.get_version.outputs.tag }}"
          mkdir -p dist
          for f in app/build/outputs/apk/prod/release/*.apk; do
            if [ -f "$f" ]; then
              cp "$f" "dist/Laya-${tag}.apk"
            fi
          done
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laya-${{ steps.get_version.outputs.tag }}-apk
          path: dist/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Laya ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
